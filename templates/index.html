<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1 class="text-center mb-4">User Management</h1>

  <!-- User Table -->
  <div class="card mb-4">
    <div class="card-header">All Users</div>
    <div class="card-body p-0">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Password</th><th>Actions</th></tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ user[0] }}</td><td>{{ user[1] }}</td><td>{{ user[2] }}</td><td>{{ user[3] }}</td>
            <td>
              <a href="{{ url_for('update_user', id=user[0]) }}" class="btn btn-sm btn-primary">Edit</a>
              <a href="{{ url_for('delete_user', id=user[0]) }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add New User -->
  <div class="card">
    <div class="card-header">Add New User</div>
    <form class="card-body" method="POST" action="{{ url_for('add') }}">
      <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" name="name" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
      <button type="submit" class="btn btn-success">Add User</button>
    </form>
  </div>
</div>
</body>
</html>
