<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h2 class="text-center mb-4">Update User</h2>
  <div class="card">
    <form method="POST" class="card-body">
      <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ user[1] }}" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user[2] }}" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" value="{{ user[3] }}" required></div>
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
</body>
</html>
